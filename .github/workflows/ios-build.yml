name: iOS Build (unsigned IPA)

# 触发方式：
#   1. 手动：GitHub 仓库 → Actions → iOS Build → Run workflow
#   2. 推送 ios-* 开头的 tag 自动触发
on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-*'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Force CocoaPods (disable Swift Package Manager)
        # Flutter 3.44 默认 SPM；本项目插件(just_audio/audio_service等)走 CocoaPods 最稳定
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter pub get
        run: flutter pub get

      - name: Pod install (diagnostic)
        # 显式跑 pod install，输出安装日志；确认 path_provider_foundation 是否被装上
        run: |
          cd ios
          pod install 2>&1 | tee pod-install.log
          echo "== path_provider pod status =="
          grep -i "path_provider" pod-install.log || echo "NO path_provider in pod log"
          ls Pods 2>/dev/null | grep -i path || echo "NO path_provider pod dir"

      - name: Xcode environment check
        run: |
          xcodebuild -version
          flutter doctor -v | grep -A 2 "Xcode" || true

      - name: Build unsigned iOS app
        # flutter build ios 产出 .app（未签名），比 build ipa 更可控
        run: |
          flutter build ios --release --no-codesign \
            --build-name=1.5.0 --build-number=150
          echo "== iphoneos output =="
          ls -la build/ios/iphoneos/ || true

      - name: Package unsigned IPA
        # 未签名 .app 手动打成 Payload 结构的 .ipa（爱思助手/Sideloadly 可直接自签）
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../liquid_music-unsigned.ipa Payload
          cd ../../..
          echo "== final artifact =="
          ls -la build/ios/*.ipa
          echo "== frameworks in app =="
          ls build/ios/iphoneos/Runner.app/Frameworks/ | sort

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios-unsigned
          path: build/ios/liquid_music-unsigned.ipa
          if-no-files-found: error
